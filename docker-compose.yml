# Production stack. Lives on the server at /opt/laya/docker-compose.yml
# (the deploy workflow copies this file over on each run) and reads secrets +
# the IMAGE tag from /opt/laya/.env. See deploy/.env.server.example.
name: laya

services:
  app:
    image: ${IMAGE:-ghcr.io/yahia-raouf/laya/app:latest}
    restart: unless-stopped
    ports:
      - "3080:8080" # host 3080 -> container 8080, bound 0.0.0.0 for the tunnel
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      LAYA_ADMIN_SECRET: ${LAYA_ADMIN_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      LAYA_CACHE: /data/laya
    volumes:
      - laya-cache:/data/laya # ~1.7 GB model weights, persisted across deploys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  laya-cache:
  pg-data:
